name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check src build.zig
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
